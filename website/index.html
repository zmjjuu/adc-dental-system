<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安德鲁牙科连锁管理系统 ADC</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 登录页 -->
  <div id="login-view" class="login-wrap hidden">
    <div class="login-card">
      <div class="login-logo">🦷</div>
      <h1>安德鲁牙科连锁管理系统</h1>
      <p class="login-sub">Andrew's Dental Chain · 跨店预约 / 治疗 / 结算 / 季度核算</p>
      <form id="login-form">
        <label>登录名
          <select id="login-name">
            <option value="reception01">前台接待 · reception01（预约/到诊/结算）</option>
            <option value="dentist01">牙医 · dentist01（李铭 D-3012）</option>
            <option value="dentist02">牙医 · dentist02（王雅 D-3015）</option>
            <option value="finance01">财务 · finance01（费用/季度核算）</option>
            <option value="ops01">运营经理 · ops01（诊所/牙医/出诊）</option>
            <option value="hq01">总部经理 · hq01（报表/审批/审计）</option>
          </select>
        </label>
        <label>密码
          <input type="password" id="login-password" value="123456" placeholder="演示密码 123456">
        </label>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
        <p class="login-hint" id="login-error"></p>
      </form>
    </div>
  </div>

  <!-- 应用主体 -->
  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-icon">🦷</span><div><b>安德鲁牙科</b><small>连锁管理系统 ADC</small></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="whoami"></div>
        <button class="btn btn-ghost btn-block" id="btn-logout">退出登录</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h2 id="page-title"></h2>
        <span class="topbar-user" id="topbar-user"></span>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views-reception.js"></script>
  <script src="js/views-dentist.js"></script>
  <script src="js/views-finance.js"></script>
  <script src="js/views-ops.js"></script>
  <script src="js/views-hq.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
