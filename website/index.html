<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安德鲁牙科连锁管理系统 ADC</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 登录页 -->
  <div id="login-view" class="login-wrap hidden">
    <div class="login-card">
      <div class="login-logo">🦷</div>
      <h1>安德鲁牙科连锁管理系统</h1>
      <p class="login-sub">Andrew's Dental Chain · 医生与管理者平台（患者请使用微信小程序）</p>
      <form id="login-form">
        <label>登录名
          <select id="login-name">
            <option value="F-1001">前台 · 工号 F-1001（周小燕）</option>
            <option value="F-1002">前台 · 工号 F-1002（林芳）</option>
            <option value="D-3012">牙医 · 工号 D-3012（李铭）</option>
            <option value="D-3015">牙医 · 工号 D-3015（王雅）</option>
            <option value="C-4001">财务 · 工号 C-4001（郑晓东）</option>
            <option value="O-5001">运营经理 · 工号 O-5001（吴建国）</option>
            <option value="H-6001">总部经理 · 工号 H-6001（赵德柱）</option>
          </select>
        </label>
        <label>密码
          <input type="password" id="login-password" value="123456" placeholder="演示密码 123456">
        </label>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
        <p class="login-hint" id="login-error"></p>
      </form>
    </div>
  </div>

  <!-- 应用主体 -->
  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-icon">🦷</span><div><b>安德鲁牙科</b><small>连锁管理系统 ADC</small></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="whoami"></div>
        <button class="btn btn-ghost btn-block" id="btn-logout">退出登录</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h2 id="page-title"></h2>
        <span class="topbar-user" id="topbar-user"></span>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views-reception.js"></script>
  <script src="js/views-dentist.js"></script>
  <script src="js/views-finance.js"></script>
  <script src="js/views-ops.js"></script>
  <script src="js/views-hq.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
